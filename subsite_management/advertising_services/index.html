  function b64utf8(b){
    var bin = atob(b); var bytes = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }
  function showView(key, el){
    document.getElementById('ads-frame').srcdoc = b64utf8(PAGES[key]);
    document.querySelectorAll('aside.side a.ng-switch').forEach(function(a){
      a.classList.toggle('active', a===el);
    });
  }
  document.querySelectorAll('aside.side a.ng-switch').forEach(function(a){
    a.addEventListener('click', function(e){
      e.preventDefault();
      var k = a.getAttribute('data-switch');
      if (k) showView(k, a);
    });
  });
  var groups = document.querySelectorAll('aside.side details.navgroup:not(.ng-closed)');
  groups.forEach(function(g){
    g.addEventListener('toggle', function(){
      if (!g.open) return;
      groups.forEach(function(o){ if (o!==g && o.open) o.open=false; });
    });
  });
  showView('subsite', document.querySelector('aside.side a.ng-switch.active'));
})();
