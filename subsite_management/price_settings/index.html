  function b64utf8(b64){
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8').decode(bytes);
  }
  function showView(key, el){
    var f = document.getElementById('price-frame');
    f.srcdoc = b64utf8(PAGES[key]);
    document.querySelectorAll('aside.side a.ng-switch').forEach(function(a){
      a.classList.toggle('active', a === el);
    });
  }
  document.querySelectorAll('aside.side a.ng-switch').forEach(function(a){
    a.addEventListener('click', function(e){
      e.preventDefault();
      var k = a.getAttribute('data-switch');
      if (k) showView(k, a);
    });
  });
  // Sidebar accordion: opening one group closes the others
  var groups = document.querySelectorAll('aside.side details.navgroup:not(.ng-closed)');
  groups.forEach(function(g){
    g.addEventListener('toggle', function(){
      if (!g.open) return;
      groups.forEach(function(o){ if (o !== g && o.open) o.open = false; });
    });
  });
  // Default view
  var first = document.querySelector('aside.side a.ng-switch.active')
           || document.querySelector('aside.side a.ng-switch');
  showView('subsite', first);
})();
